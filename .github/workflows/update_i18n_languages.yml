name: update_i18n_languages.yml

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  update-i18n:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'Translations update from Hosted Weblate')
    runs-on: ubuntu-latest

    steps:
      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout master branch
        uses: actions/checkout@v4
        with:
          ref: master
          path: master
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        name: Install Bun
        with:
          bun-version-file: './master/package.json'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-${{ hashFiles('**/bun.lock') }}

      - name: Install dependencies
        run: |
          cd master
          bun install --frozen-lockfile

      - name: Update i18n resources
        run: |
          cd master
          echo "WEBLATE_TOKEN=${{ secrets.MY_SECRET }}" > .env
          bun run i18n:gen-resources
          bun run manga:gen-type-tags

      - name: Push changes
        run: |
          cd master
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
